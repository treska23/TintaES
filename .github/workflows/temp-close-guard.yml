name: Temporary close guard validation

on:
  push:
    branches:
      - codex/confirm-unsaved-on-exit

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/confirm-unsaved-on-exit
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply guarded close fix
        shell: pwsh
        run: |
          python scripts/apply-close-guard.py
          git diff --check

      - name: Build Release
        shell: pwsh
        run: dotnet build TintaES.sln --configuration Release

      - name: Run core regression tests
        shell: pwsh
        run: dotnet run --project tests/TintaES.Core.Tests/TintaES.Core.Tests.csproj --configuration Release --no-build

      - name: Verify close guard wiring
        shell: pwsh
        run: |
          $guard = Get-Content 'src/TintaES.Wpf/MainWindow.CloseGuard.cs' -Raw
          $persistence = Get-Content 'src/TintaES.Wpf/MainWindow.ProjectPersistence.cs' -Raw
          foreach ($token in @('Guardar todo', 'Descartar todo', 'Cancelar', 'Closing += MainWindow_Closing', 'SaveActiveProjectAsync')) {
              if (-not ($guard.Contains($token) -or $persistence.Contains($token))) { throw "Falta $token" }
          }
          if (-not $persistence.Contains('private async Task<bool> SaveActiveProjectAsync()')) { throw 'El guardado no devuelve éxito/cancelación.' }

      - name: Commit validated change
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.github/workflows/temp-close-guard.yml'
          Remove-Item 'scripts/apply-close-guard.py'
          git diff --check
          git config user.name 'TintaES CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/TintaES.Wpf/MainWindow.ProjectPersistence.cs src/TintaES.Wpf/MainWindow.CloseGuard.cs .github/workflows/temp-close-guard.yml scripts/apply-close-guard.py
          git commit -m 'Prompt to save unsaved changes before exit'
          git push origin HEAD:codex/confirm-unsaved-on-exit
