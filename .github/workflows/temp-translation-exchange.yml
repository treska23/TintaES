name: Temporary translation exchange validation

on:
  push:
    branches:
      - codex/translation-exchange-script

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply guarded regression test
        shell: pwsh
        run: python scripts/apply-translation-exchange-test.py
      - name: Build Release
        shell: pwsh
        run: dotnet build TintaES.sln --configuration Release
      - name: Run core regression tests
        shell: pwsh
        run: dotnet run --project tests/TintaES.Core.Tests/TintaES.Core.Tests.csproj --configuration Release --no-build
      - name: Commit regression test
        shell: pwsh
        run: |
          git config user.name "TintaES CI"
          git config user.email "actions@users.noreply.github.com"
          git add tests/TintaES.Core.Tests/Program.cs
          if (-not (git diff --cached --quiet)) {
            git commit -m "Test translation script round-trip and stable IDs"
            git push origin HEAD:codex/translation-exchange-script
          }
