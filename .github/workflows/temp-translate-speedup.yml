name: Temporary TranslateGemma speedup

on:
  push:
    branches:
      - codex/speed-up-translategemma-12b

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/speed-up-translategemma-12b
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply exact guarded changes
        shell: pwsh
        run: |
          python scripts/apply-translategemma-speedup.py
          git diff --check

      - name: Run translation regression tests
        shell: pwsh
        run: dotnet run --project tests\TintaES.Core.Tests\TintaES.Core.Tests.csproj --configuration Release

      - name: Build solution
        shell: pwsh
        run: dotnet build TintaES.sln --configuration Release

      - name: Commit validated source changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.github/workflows/temp-translate-speedup.yml'
          Remove-Item 'scripts/apply-translategemma-speedup.py'
          git diff --check
          git config user.name 'TintaES CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src/TintaES.Core/OllamaClient.cs tests/TintaES.Core.Tests/Program.cs .github/workflows/temp-translate-speedup.yml scripts/apply-translategemma-speedup.py
          git commit -m 'Speed up TranslateGemma 12B batching without quality loss'
          git push origin HEAD:codex/speed-up-translategemma-12b
