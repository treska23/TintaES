name: Temporary app icon build

on:
  push:
    branches:
      - codex/add-app-icon

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        shell: pwsh
        run: dotnet build TintaES.sln --configuration Release
      - name: Verify icon file exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'src/TintaES.Wpf/Resources/TintaES.ico')) { throw 'Falta TintaES.ico' }
          if (-not (Select-String -Path 'src/TintaES.Wpf/TintaES.Wpf.csproj' -Pattern '<ApplicationIcon>Resources\\TintaES.ico</ApplicationIcon>' -Quiet)) { throw 'ApplicationIcon no configurado' }
          Write-Host 'Icono configurado y compilable.'
