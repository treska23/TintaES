name: Windows build

on:
  push:
    branches:
      - main
      - agent/preserve-original-lettering
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
          persist-credentials: true

      - name: Vendor Klee manga font
        if: github.event_name == 'push' && github.ref_name == 'agent/preserve-original-lettering' && github.actor != 'github-actions[bot]'
        shell: pwsh
        run: |
          $fontPath = 'engine/manga-image-translator/fonts/klee_one_semibold_es.ttf'
          if (Test-Path $fontPath) { exit 0 }
          New-Item -ItemType Directory -Force -Path (Split-Path $fontPath) | Out-Null
          python -m pip install --quiet fonttools
          Invoke-WebRequest 'https://raw.githubusercontent.com/fontworks-fonts/Klee/master/fonts/ttf/KleeOne-SemiBold.ttf' -OutFile "$env:RUNNER_TEMP/KleeOne-SemiBold.ttf"
          pyftsubset "$env:RUNNER_TEMP/KleeOne-SemiBold.ttf" `
            --output-file=$fontPath `
            --unicodes='U+0020-007E,U+00A0-00FF,U+0100-017F,U+2010-2027,U+2030-205E,U+20AC' `
            --layout-features='*' `
            --glyph-names --symbol-cmap --legacy-cmap `
            --name-IDs='*' --name-legacy --name-languages='*' `
            --notdef-glyph --notdef-outline --recommended-glyphs
          Invoke-WebRequest 'https://raw.githubusercontent.com/fontworks-fonts/Klee/master/OFL.txt' -OutFile 'engine/manga-image-translator/fonts/OFL-Klee-One.txt'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $fontPath 'engine/manga-image-translator/fonts/OFL-Klee-One.txt'
          git commit -m 'assets: vendor Klee One manga font'
          git push origin HEAD:agent/preserve-original-lettering

      - name: Build WPF project
        shell: pwsh
        run: |
          dotnet build src/TintaES.Wpf/TintaES.Wpf.csproj --configuration Release *> wpf-build.log
          $exitCode = $LASTEXITCODE
          Get-Content wpf-build.log | Select-String -Pattern "error (CS|MC|XDG|NETSDK)"
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload WPF build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpf-build-log
          path: wpf-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Build core tests
        run: dotnet build tests/TintaES.Core.Tests/TintaES.Core.Tests.csproj --configuration Release
