name: Windows build

on:
  push:
    branches:
      - main
      - agent/preserve-original-lettering
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
          persist-credentials: false

      - name: Package current source for editor refactor
        shell: pwsh
        run: |
          Compress-Archive -Path src/TintaES.Core,src/TintaES.Wpf -DestinationPath tinta-source.zip -Force

      - name: Upload current source
        uses: actions/upload-artifact@v4
        with:
          name: tinta-source-r30
          path: tinta-source.zip
          if-no-files-found: error
          retention-days: 1

      - name: Build WPF project
        shell: pwsh
        run: |
          dotnet build src/TintaES.Wpf/TintaES.Wpf.csproj --configuration Release *> wpf-build.log
          $exitCode = $LASTEXITCODE
          Get-Content wpf-build.log | Select-String -Pattern "error (CS|MC|XDG|NETSDK)"
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload WPF build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpf-build-log
          path: wpf-build.log
          if-no-files-found: error
          retention-days: 1

      - name: Build core tests
        run: dotnet build tests/TintaES.Core.Tests/TintaES.Core.Tests.csproj --configuration Release
